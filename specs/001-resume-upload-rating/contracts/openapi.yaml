openapi: 3.1.0
info:
  title: Resume Fit Evaluator API
  version: 0.2.0
  description: |
    Single-user FastAPI service. Saves a baseline resume profile, evaluates
    job descriptions against it with three-tier scoring, and tracks history.
    All responses follow the envelope `{ data, error, meta }`.

servers:
  - url: http://localhost:8000
    description: Local dev

tags:
  - name: health
  - name: profile
  - name: evaluate
  - name: history

paths:
  /api/health:
    get:
      tags: [health]
      summary: Liveness probe
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthEnvelope"

  /api/profile:
    post:
      tags: [profile]
      summary: Save (upsert) the baseline resume profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileIn"
      responses:
        "200":
          description: Profile saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileEnvelope"
        "422":
          $ref: "#/components/responses/Error"
    get:
      tags: [profile]
      summary: Retrieve the saved baseline profile
      responses:
        "200":
          description: Profile found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileEnvelope"
        "404":
          $ref: "#/components/responses/Error"

  /api/evaluate:
    post:
      tags: [evaluate]
      summary: Score a single JD against the baseline (three-tier)
      description: |
        Scores the JD 0–100 and returns one of three statuses:
        - `ready_to_submit` (85+): no tailoring needed
        - `needs_tailoring` (60–84): background tailoring triggered
        - `skip` (<60): poor fit, skip_reason provided
        Duplicate JDs (same content hash) return the cached result.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EvaluateIn"
      responses:
        "200":
          description: Evaluation result (new or cached)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvaluateEnvelope"
        "404":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"

  /api/evaluate/bulk:
    post:
      tags: [evaluate]
      summary: Score multiple JDs in one request
      description: |
        Evaluates each JD against the baseline. Deduplicates by content hash —
        a JD already in the DB returns `cached: true` without an LLM call.
        Background tailoring is triggered for each new `needs_tailoring` result.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkEvaluateIn"
      responses:
        "200":
          description: Bulk evaluation summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkEvaluateEnvelope"
        "404":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"

  /api/callback:
    post:
      tags: [evaluate]
      summary: Deliver a generated resume from an external pipeline
      description: |
        Accepts a generated resume (e.g., from n8n or a CI pipeline) and stores
        it. Sets can_submit=true on the parent JobAnalysis.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CallbackIn"
      responses:
        "200":
          description: Resume stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdEnvelope"
        "404":
          $ref: "#/components/responses/Error"

  /api/history:
    get:
      tags: [history]
      summary: List all evaluated JDs, grouped by status
      responses:
        "200":
          description: History list with grouped breakdown
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HistoryListEnvelope"

  /api/history/{id}:
    get:
      tags: [history]
      summary: Get a single job analysis with generated resumes
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Job analysis detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HistoryDetailEnvelope"
        "404":
          $ref: "#/components/responses/Error"

  /api/submittable:
    get:
      tags: [history]
      summary: List jobs where can_submit=true with their latest resume
      responses:
        "200":
          description: Submittable list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubmittableEnvelope"

components:
  schemas:
    Meta:
      type: object
      properties:
        request_id: { type: string }
        cached: { type: boolean }
      additionalProperties: true

    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }

    ProfileIn:
      type: object
      required: [skills_text]
      properties:
        skills_text: { type: string }

    Profile:
      type: object
      properties:
        id: { type: integer }
        skills_text: { type: string }
        updated_at: { type: string, format: date-time }

    EvaluateIn:
      type: object
      required: [jd_text]
      properties:
        jd_text: { type: string }

    EvaluateOut:
      type: object
      properties:
        job_analysis_id: { type: string, format: uuid }
        score: { type: integer, minimum: 0, maximum: 100 }
        explanation: { type: string }
        strengths:
          type: array
          items: { type: string }
        gaps:
          type: array
          items: { type: string }
        threshold_met: { type: boolean }
        status:
          type: string
          enum: [ready_to_submit, needs_tailoring, skip]
        message: { type: string }
        action:
          type: string
          enum: [none, tailoring, skip]

    BulkEvaluateIn:
      type: object
      required: [jd_texts]
      properties:
        jd_texts:
          type: array
          items: { type: string }
          minItems: 1
          maxItems: 100

    BulkEvaluateResult:
      type: object
      properties:
        job_analysis_id: { type: string, format: uuid }
        jd_snippet: { type: string }
        score: { type: integer, minimum: 0, maximum: 100 }
        status:
          type: string
          enum: [ready_to_submit, needs_tailoring, skip]
        cached: { type: boolean }

    BulkEvaluateOut:
      type: object
      properties:
        total: { type: integer }
        new: { type: integer }
        cached: { type: integer }
        results:
          type: array
          items: { $ref: "#/components/schemas/BulkEvaluateResult" }

    CallbackIn:
      type: object
      required: [job_analysis_id, resume_text]
      properties:
        job_analysis_id: { type: string, format: uuid }
        resume_text: { type: string }
        pdf_url: { type: string, nullable: true }
        prompt_version: { type: string, nullable: true }

    HistoryItem:
      type: object
      properties:
        id: { type: string, format: uuid }
        jd_snippet: { type: string, nullable: true }
        score: { type: integer, nullable: true }
        threshold_met: { type: boolean }
        status: { type: string, nullable: true }
        can_submit: { type: boolean }
        created_at: { type: string, format: date-time }

    GeneratedResume:
      type: object
      properties:
        id: { type: string, format: uuid }
        resume_text: { type: string }
        pdf_url: { type: string, nullable: true }
        prompt_version: { type: string, nullable: true }
        created_at: { type: string, format: date-time }

    HistoryDetail:
      allOf:
        - $ref: "#/components/schemas/HistoryItem"
        - type: object
          properties:
            jd_full_text: { type: string }
            skip_reason: { type: string, nullable: true }
            generated_resumes:
              type: array
              items: { $ref: "#/components/schemas/GeneratedResume" }

    SubmittableItem:
      type: object
      properties:
        id: { type: string, format: uuid }
        score: { type: integer, nullable: true }
        jd_snippet: { type: string, nullable: true }
        status: { type: string, nullable: true }
        can_submit: { type: boolean }
        created_at: { type: string, format: date-time }
        pdf_url: { type: string, nullable: true }
        resume_id: { type: string, format: uuid, nullable: true }

    # Envelopes
    HealthEnvelope:
      type: object
      properties:
        data:
          type: object
          properties:
            status: { type: string, enum: [ok] }
        error: { type: "null" }
        meta: { $ref: "#/components/schemas/Meta" }

    ProfileEnvelope:
      type: object
      properties:
        data: { $ref: "#/components/schemas/Profile" }
        error: { type: "null" }
        meta: { $ref: "#/components/schemas/Meta" }

    EvaluateEnvelope:
      type: object
      properties:
        data: { $ref: "#/components/schemas/EvaluateOut" }
        error: { type: "null" }
        meta: { $ref: "#/components/schemas/Meta" }

    BulkEvaluateEnvelope:
      type: object
      properties:
        data: { $ref: "#/components/schemas/BulkEvaluateOut" }
        error: { type: "null" }
        meta: { $ref: "#/components/schemas/Meta" }

    HistoryListEnvelope:
      type: object
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/HistoryItem" }
        error: { type: "null" }
        meta:
          allOf:
            - $ref: "#/components/schemas/Meta"
            - type: object
              properties:
                total: { type: integer }
                submittable_count: { type: integer }
                grouped:
                  type: object
                  additionalProperties:
                    type: array
                    items: { $ref: "#/components/schemas/HistoryItem" }

    HistoryDetailEnvelope:
      type: object
      properties:
        data: { $ref: "#/components/schemas/HistoryDetail" }
        error: { type: "null" }
        meta: { $ref: "#/components/schemas/Meta" }

    SubmittableEnvelope:
      type: object
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/SubmittableItem" }
        error: { type: "null" }
        meta:
          allOf:
            - $ref: "#/components/schemas/Meta"
            - type: object
              properties:
                count: { type: integer }

    IdEnvelope:
      type: object
      properties:
        data:
          type: object
          properties:
            id: { type: string, format: uuid }
        error: { type: "null" }
        meta: { $ref: "#/components/schemas/Meta" }

    ErrorEnvelope:
      type: object
      properties:
        data: { type: "null" }
        error: { $ref: "#/components/schemas/Error" }
        meta: { $ref: "#/components/schemas/Meta" }

  responses:
    Error:
      description: Error envelope
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
