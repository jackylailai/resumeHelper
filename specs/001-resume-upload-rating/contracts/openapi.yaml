openapi: 3.1.0
info:
  title: Resume Fit Evaluator API
  version: 0.3.0
  description: |
    Single-user FastAPI service. Maintains a library of baseline resume
    profiles, evaluates job descriptions against a selected profile with
    three-tier scoring, and tracks history. Uploaded PDFs are persisted on
    local disk under `${STORAGE_DIR}/profiles/<id>/<utc-ts>.pdf` and the
    absolute path is returned on the response.
    All responses follow the envelope `{ data, error, meta }`.

servers:
  - url: http://localhost:8000
    description: Local dev

tags:
  - name: health
  - name: profile
  - name: evaluate
  - name: history
  - name: jobs
  - name: job-listings
  - name: applications

paths:
  /api/health:
    get:
      tags: [health]
      summary: Aggregate health, readiness, counts, and next actions
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthEnvelope"

  /api/health/live:
    get:
      tags: [health]
      summary: Process liveness probe
      responses:
        "200":
          description: Process is running
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LivenessEnvelope"

  /api/health/ready:
    get:
      tags: [health]
      summary: Dependency readiness probe
      responses:
        "200":
          description: Ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessEnvelope"
        "503":
          description: Not ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessEnvelope"

  /api/profile:
    post:
      tags: [profile]
      summary: Save (upsert) the baseline resume profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileIn"
      responses:
        "200":
          description: Profile saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileEnvelope"
        "422":
          $ref: "#/components/responses/Error"
    get:
      tags: [profile]
      summary: Retrieve the most recently created baseline profile (legacy)
      responses:
        "200":
          description: Profile found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileEnvelope"
        "404":
          $ref: "#/components/responses/Error"

  /api/profile/upload:
    post:
      tags: [profile]
      summary: Upload a PDF and create a baseline profile (legacy singular endpoint)
      description: |
        Server extracts text via pypdf, strips NUL bytes, persists the
        original PDF under `${STORAGE_DIR}/profiles/<id>/<utc-ts>.pdf`, and
        returns the new profile with `pdf_path` populated.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "200":
          description: Profile created from PDF
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileEnvelope"
        "400":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"

  /api/profiles:
    get:
      tags: [profile]
      summary: List all baseline profiles
      responses:
        "200":
          description: Profile list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileListEnvelope"
    post:
      tags: [profile]
      summary: Create a baseline profile from raw text
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileIn"
      responses:
        "200":
          description: Profile created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileEnvelope"
        "400":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"

  /api/profiles/upload:
    post:
      tags: [profile]
      summary: Create a baseline profile from a PDF upload
      description: |
        Server extracts text via pypdf, strips NUL bytes, persists the
        original PDF under `${STORAGE_DIR}/profiles/<id>/<utc-ts>.pdf`, and
        returns the new profile with `pdf_path` populated.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                name:
                  type: string
                skills_text:
                  type: string
                  description: Reviewed text override. If omitted, extracted PDF text is used.
                is_default:
                  type: boolean
      responses:
        "200":
          description: Profile created from PDF
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileEnvelope"
        "400":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"

  /api/profiles/upload/preview:
    post:
      tags: [profile]
      summary: Extract text from a profile PDF without creating a row
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "200":
          description: Extracted text preview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfilePdfPreviewEnvelope"
        "400":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"

  /api/profiles/{profile_id}:
    parameters:
      - in: path
        name: profile_id
        required: true
        schema: { type: integer }
    get:
      tags: [profile]
      summary: Get one baseline profile
      responses:
        "200":
          description: Profile found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileEnvelope"
        "404":
          $ref: "#/components/responses/Error"
    put:
      tags: [profile]
      summary: Update name and/or skills_text on a baseline profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileUpdateIn"
      responses:
        "200":
          description: Profile updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileEnvelope"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
    delete:
      tags: [profile]
      summary: Delete a baseline profile
      responses:
        "200":
          description: Profile deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdEnvelope"
        "404":
          $ref: "#/components/responses/Error"

  /api/profiles/{profile_id}/delete-impact:
    get:
      tags: [profile]
      summary: Count rows affected by deleting a profile link
      parameters:
        - in: path
          name: profile_id
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Delete impact counts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileDeleteImpactEnvelope"
        "404":
          $ref: "#/components/responses/Error"

  /api/evaluate:
    post:
      tags: [evaluate]
      summary: Score a single JD against the baseline (three-tier)
      description: |
        Scores the JD 0–100 and returns one of three statuses:
        - `ready_to_submit` (85+): no tailoring needed
        - `needs_tailoring` (60–84): durable tailoring queued
        - `skip` (<60): poor fit, skip_reason provided
        Duplicate JDs (same content hash) return the cached result.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EvaluateIn"
      responses:
        "200":
          description: Evaluation result (new or cached)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvaluateEnvelope"
        "404":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"

  /api/evaluate/bulk:
    post:
      tags: [evaluate]
      summary: Score multiple JDs in one request
      description: |
        Evaluates each JD against the baseline. Deduplicates by content hash —
        a JD already in the DB returns `cached: true` without an LLM call.
        Durable tailoring is triggered for each new `needs_tailoring` result.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkEvaluateIn"
      responses:
        "200":
          description: Bulk evaluation summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkEvaluateEnvelope"
        "404":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"

  /api/evaluate/by-listings:
    post:
      tags: [evaluate]
      summary: Score stored JD Database listings and link successful analyses
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EvaluateByListingsIn"
      responses:
        "200":
          description: Per-listing evaluation summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvaluateByListingsEnvelope"
        "404":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"

  /api/evaluate/pending-listings:
    post:
      tags: [evaluate]
      summary: Score pending JD Database listings and link successful analyses
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EvaluatePendingListingsIn"
      responses:
        "200":
          description: Pending-listing evaluation summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvaluateByListingsEnvelope"
        "404":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"

  /api/callback:
    post:
      tags: [evaluate]
      summary: Deliver a generated resume from an external pipeline
      description: |
        Accepts a generated resume from an external pipeline and stores it.
        Sets can_submit=true on the parent JobAnalysis.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CallbackIn"
      responses:
        "200":
          description: Resume stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdEnvelope"
        "404":
          $ref: "#/components/responses/Error"

  /api/history:
    get:
      tags: [history]
      summary: List all evaluated JDs, grouped by status
      responses:
        "200":
          description: History list with grouped breakdown
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HistoryListEnvelope"

  /api/history/{id}:
    get:
      tags: [history]
      summary: Get a single job analysis with generated resumes
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Job analysis detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HistoryDetailEnvelope"
        "404":
          $ref: "#/components/responses/Error"

  /api/jobs/{job_id}:
    get:
      tags: [jobs]
      summary: Get durable tailoring job status
      description: |
        Returns the current state for a durable tailoring job created by
        evaluation. Clients poll this endpoint until `status` is `succeeded`,
        `failed`, or `cancelled`. On `succeeded`, fetch
        `/api/history/{job_analysis_id}` for the generated resume.
      parameters:
        - in: path
          name: job_id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Durable job status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TailoringJobEnvelope"
        "404":
          $ref: "#/components/responses/Error"
    post:
      tags: [jobs]
      summary: Request cancellation for a durable AI job
      description: |
        Cancels queued or retry-wait jobs immediately. Running jobs move to
        `cancel_requested`; workers observe that signal before committing
        generated output.
      parameters:
        - in: path
          name: job_id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Updated durable job status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TailoringJobEnvelope"
        "404":
          $ref: "#/components/responses/Error"

  /api/submittable:
    get:
      tags: [history]
      summary: List jobs where can_submit=true with their latest resume
      responses:
        "200":
          description: Submittable list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubmittableEnvelope"

  /api/generated-resumes/{id}/pdf:
    get:
      tags: [history]
      summary: Generate if needed and download a tailored resume PDF
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: PDF file
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        "404":
          $ref: "#/components/responses/Error"

  /api/job-listings:
    get:
      tags: [job-listings]
      summary: List stored job listings with search, filters, sorting, and pagination
      parameters:
        - in: query
          name: q
          schema: { type: string, maxLength: 120 }
        - in: query
          name: source
          schema: { type: string, maxLength: 32 }
        - in: query
          name: analyzed
          schema: { type: boolean }
        - in: query
          name: status
          schema:
            type: string
            enum: [unanalyzed, ready_to_submit, needs_tailoring, skip, failed-invalid, failed_invalid]
        - in: query
          name: sort_by
          schema:
            type: string
            enum: [scraped_at, score, company, source]
            default: scraped_at
        - in: query
          name: sort_dir
          schema:
            type: string
            enum: [asc, desc]
            default: desc
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - in: query
          name: offset
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        "200":
          description: Job listing summaries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobListingListEnvelope"

  /api/job-listings/{id}:
    get:
      tags: [job-listings]
      summary: Get one stored job listing with full JD text
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Job listing detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobListingEnvelope"
        "404":
          $ref: "#/components/responses/Error"

  /api/applications:
    get:
      tags: [applications]
      summary: List tracked applications
      parameters:
        - in: query
          name: q
          schema: { type: string, maxLength: 120 }
        - in: query
          name: status
          schema:
            type: string
            enum: [planned, applied, interviewing, rejected, offer, archived]
        - in: query
          name: sort_by
          schema:
            type: string
            enum: [created_at, updated_at, follow_up_date, score, company, status]
            default: updated_at
        - in: query
          name: sort_dir
          schema:
            type: string
            enum: [asc, desc]
            default: desc
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - in: query
          name: offset
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        "200":
          description: Application list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationListEnvelope"
    post:
      tags: [applications]
      summary: Track an application linked to a listing, analysis, or generated resume
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApplicationCreateIn"
      responses:
        "200":
          description: Existing application returned and optionally updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationEnvelope"
        "201":
          description: Application created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationEnvelope"
        "404":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"

  /api/applications/{application_id}:
    patch:
      tags: [applications]
      summary: Update tracked application status, follow-up date, or notes
      parameters:
        - in: path
          name: application_id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApplicationUpdateIn"
      responses:
        "200":
          description: Application updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationEnvelope"
        "404":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"

components:
  schemas:
    Meta:
      type: object
      properties:
        request_id: { type: string }
        cached: { type: boolean }
      additionalProperties: true

    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }

    ProfileIn:
      type: object
      required: [skills_text]
      properties:
        skills_text: { type: string }
        name: { type: string, nullable: true }
        is_default: { type: boolean, default: false }

    ProfileUpdateIn:
      type: object
      properties:
        skills_text: { type: string, nullable: true }
        name: { type: string, nullable: true }
        is_default: { type: boolean, nullable: true }

    Profile:
      type: object
      properties:
        id: { type: integer }
        name: { type: string, nullable: true }
        skills_text: { type: string }
        pdf_path:
          type: string
          nullable: true
          description: Absolute path to the persisted PDF on local disk; null if the profile was created from raw text.
        is_default: { type: boolean }
        created_at: { type: string, format: date-time, nullable: true }
        updated_at: { type: string, format: date-time }

    ProfilePdfPreview:
      type: object
      properties:
        filename: { type: string }
        skills_text: { type: string }

    ProfileDeleteImpact:
      type: object
      properties:
        profile_id: { type: integer }
        job_analyses_count: { type: integer }
        generated_resumes_count: { type: integer }

    EvaluateIn:
      type: object
      required: [jd_text]
      properties:
        jd_text: { type: string }
        profile_id:
          type: integer
          nullable: true
          description: If omitted, the default profile is used, falling back to the latest profile.

    EvaluateOut:
      type: object
      properties:
        job_analysis_id: { type: string, format: uuid }
        tailoring_job_id: { type: string, format: uuid, nullable: true }
        tailoring_status:
          type: string
          enum: [queued, running, retry_wait, cancel_requested, cancelled, succeeded, failed]
          nullable: true
        score: { type: integer, minimum: 0, maximum: 100 }
        explanation: { type: string }
        strengths:
          type: array
          items: { type: string }
        gaps:
          type: array
          items: { type: string }
        threshold_met: { type: boolean }
        status:
          type: string
          enum: [ready_to_submit, needs_tailoring, skip]
        message: { type: string }
        action:
          type: string
          enum: [none, tailoring, skip]
        prompt_version: { type: string, nullable: true }
        llm_backend: { type: string, nullable: true }
        llm_model: { type: string, nullable: true }

    BulkEvaluateIn:
      type: object
      required: [jd_texts]
      properties:
        jd_texts:
          type: array
          items: { type: string }
          minItems: 1
          maxItems: 100

    BulkEvaluateResult:
      type: object
      properties:
        job_analysis_id: { type: string, format: uuid }
        tailoring_job_id: { type: string, format: uuid, nullable: true }
        tailoring_status:
          type: string
          enum: [queued, running, retry_wait, cancel_requested, cancelled, succeeded, failed]
          nullable: true
        jd_snippet: { type: string }
        score: { type: integer, minimum: 0, maximum: 100 }
        status:
          type: string
          enum: [ready_to_submit, needs_tailoring, skip]
        cached: { type: boolean }

    BulkEvaluateOut:
      type: object
      properties:
        total: { type: integer }
        new: { type: integer }
        cached: { type: integer }
        skipped: { type: integer }
        blocked: { type: integer }
        estimated_input_tokens: { type: integer, nullable: true }
        estimated_output_tokens: { type: integer, nullable: true }
        estimated_total_tokens: { type: integer, nullable: true }
        estimated_cost_usd: { type: number, nullable: true }
        results:
          type: array
          items: { $ref: "#/components/schemas/BulkEvaluateResult" }

    EvaluateByListingsIn:
      type: object
      required: [job_listing_ids]
      properties:
        profile_id: { type: integer, nullable: true }
        job_listing_ids:
          type: array
          minItems: 1
          maxItems: 20
          items: { type: string, format: uuid }

    EvaluatePendingListingsIn:
      type: object
      properties:
        profile_id: { type: integer, nullable: true }
        source: { type: string, nullable: true }
        limit: { type: integer, minimum: 1, maximum: 100, default: 100 }

    EvaluateByListingsResult:
      type: object
      properties:
        listing_id: { type: string, format: uuid }
        job_analysis_id: { type: string, format: uuid, nullable: true }
        tailoring_job_id: { type: string, format: uuid, nullable: true }
        tailoring_status:
          type: string
          enum: [queued, running, retry_wait, cancel_requested, cancelled, succeeded, failed]
          nullable: true
        score: { type: integer, minimum: 0, maximum: 100, nullable: true }
        status:
          type: string
          enum: [ready_to_submit, needs_tailoring, skip]
          nullable: true
        cached: { type: boolean }
        error: { type: string, nullable: true }

    EvaluateByListingsOut:
      type: object
      properties:
        total: { type: integer }
        succeeded: { type: integer }
        failed: { type: integer }
        skipped: { type: integer }
        blocked: { type: integer }
        tailoring_blocked: { type: integer }
        estimated_input_tokens: { type: integer, nullable: true }
        estimated_output_tokens: { type: integer, nullable: true }
        estimated_total_tokens: { type: integer, nullable: true }
        estimated_cost_usd: { type: number, nullable: true }
        warnings:
          type: array
          items:
            type: object
            additionalProperties: true
        results:
          type: array
          items: { $ref: "#/components/schemas/EvaluateByListingsResult" }

    CallbackIn:
      type: object
      required: [job_analysis_id, resume_text]
      properties:
        job_analysis_id: { type: string, format: uuid }
        resume_text: { type: string }
        pdf_url: { type: string, nullable: true }
        prompt_version: { type: string, nullable: true }

    HistoryItem:
      type: object
      properties:
        id: { type: string, format: uuid }
        profile_id: { type: integer, nullable: true }
        tailoring_job_id: { type: string, format: uuid, nullable: true }
        tailoring_status:
          type: string
          enum: [queued, running, retry_wait, cancel_requested, cancelled, succeeded, failed]
          nullable: true
        jd_snippet: { type: string, nullable: true }
        score: { type: integer, nullable: true }
        threshold_met: { type: boolean }
        status: { type: string, nullable: true }
        can_submit: { type: boolean }
        prompt_version: { type: string, nullable: true }
        llm_backend: { type: string, nullable: true }
        llm_model: { type: string, nullable: true }
        created_at: { type: string, format: date-time }

    GeneratedResume:
      type: object
      properties:
        id: { type: string, format: uuid }
        resume_text: { type: string }
        pdf_url: { type: string, nullable: true }
        prompt_version: { type: string, nullable: true }
        llm_backend: { type: string, nullable: true }
        llm_model: { type: string, nullable: true }
        proof_point_ids:
          type: array
          items: { type: string }
        revision_source: { type: string }
        exported_at: { type: string, format: date-time, nullable: true }
        beautifications:
          type: array
          items: { $ref: "#/components/schemas/Beautification" }
        created_at: { type: string, format: date-time }

    HistoryDetail:
      allOf:
        - $ref: "#/components/schemas/HistoryItem"
        - type: object
          properties:
            jd_full_text: { type: string }
            skip_reason: { type: string, nullable: true }
            baseline_profile_text: { type: string, nullable: true }
            generated_resumes:
              type: array
              items: { $ref: "#/components/schemas/GeneratedResume" }

    Beautification:
      type: object
      properties:
        id: { type: string, format: uuid }
        generated_resume_id: { type: string, format: uuid }
        style: { type: string }
        prompt_version: { type: string, nullable: true }
        llm_backend: { type: string, nullable: true }
        llm_model: { type: string, nullable: true }
        html_url: { type: string, nullable: true }
        pdf_url: { type: string, nullable: true }
        created_at: { type: string, format: date-time }

    TailoringJob:
      type: object
      properties:
        id: { type: string, format: uuid }
        kind:
          type: string
          enum: [tailor, evaluate, evaluate_bulk, evaluate_listing, evaluate_pending_listings]
        job_analysis_id: { type: string, format: uuid, nullable: true }
        parent_job_id: { type: string, format: uuid, nullable: true }
        dedupe_key: { type: string, nullable: true }
        priority: { type: integer }
        run_after: { type: string, format: date-time }
        attempts: { type: integer }
        max_attempts: { type: integer }
        locked_by: { type: string, nullable: true }
        locked_at: { type: string, format: date-time, nullable: true }
        status:
          type: string
          enum: [queued, running, retry_wait, cancel_requested, cancelled, succeeded, failed]
        profile_id: { type: integer, nullable: true }
        job_listing_id: { type: string, format: uuid, nullable: true }
        generated_resume_id: { type: string, format: uuid, nullable: true }
        prompt_version: { type: string, nullable: true }
        request_id: { type: string, nullable: true }
        input_payload:
          type: object
          additionalProperties: true
        result_payload:
          type: object
          nullable: true
          additionalProperties: true
        error_code: { type: string, nullable: true }
        error_message: { type: string, nullable: true }
        progress_current: { type: integer }
        progress_total: { type: integer, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        started_at: { type: string, format: date-time, nullable: true }
        finished_at: { type: string, format: date-time, nullable: true }

    SubmittableItem:
      type: object
      properties:
        id: { type: string, format: uuid }
        score: { type: integer, nullable: true }
        jd_snippet: { type: string, nullable: true }
        status: { type: string, nullable: true }
        can_submit: { type: boolean }
        created_at: { type: string, format: date-time }
        pdf_url: { type: string, nullable: true }
        resume_id: { type: string, format: uuid, nullable: true }

    JobListing:
      type: object
      properties:
        id: { type: string, format: uuid }
        source: { type: string }
        source_id: { type: string }
        title: { type: string }
        company: { type: string }
        location: { type: string, nullable: true }
        url: { type: string }
        description_preview: { type: string }
        has_description: { type: boolean }
        list_status: { type: string }
        analyzed: { type: boolean }
        job_analysis_id: { type: string, format: uuid, nullable: true }
        last_score: { type: integer, nullable: true }
        last_status: { type: string, nullable: true }
        scraped_at: { type: string, format: date-time }

    JobListingDetail:
      allOf:
        - $ref: "#/components/schemas/JobListing"
        - type: object
          properties:
            description: { type: string }
            raw_json: { type: object, nullable: true, additionalProperties: true }

    ApplicationCreateIn:
      type: object
      properties:
        job_listing_id: { type: string, format: uuid, nullable: true }
        job_analysis_id: { type: string, format: uuid, nullable: true }
        generated_resume_id: { type: string, format: uuid, nullable: true }
        status:
          type: string
          enum: [planned, applied, interviewing, rejected, offer, archived]
          default: planned
        follow_up_date: { type: string, format: date, nullable: true }
        notes: { type: string, nullable: true }

    ApplicationUpdateIn:
      type: object
      properties:
        status:
          type: string
          enum: [planned, applied, interviewing, rejected, offer, archived]
          nullable: true
        follow_up_date: { type: string, format: date, nullable: true }
        notes: { type: string, nullable: true }

    Application:
      type: object
      properties:
        id: { type: string, format: uuid }
        job_listing_id: { type: string, format: uuid, nullable: true }
        job_analysis_id: { type: string, format: uuid, nullable: true }
        generated_resume_id: { type: string, format: uuid, nullable: true }
        status:
          type: string
          enum: [planned, applied, interviewing, rejected, offer, archived]
        follow_up_date: { type: string, format: date, nullable: true }
        notes: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        company: { type: string, nullable: true }
        title: { type: string, nullable: true }
        source_url: { type: string, nullable: true }
        score: { type: integer, nullable: true }
        analysis_status: { type: string, nullable: true }
        pdf_url: { type: string, nullable: true }

    # Envelopes
    HealthEnvelope:
      type: object
      properties:
        data:
          type: object
          properties:
            status: { type: string, enum: [ok, degraded] }
            liveness:
              type: object
              properties:
                status: { type: string }
                message: { type: string }
            readiness:
              type: object
              properties:
                status: { type: string, enum: [ready, not_ready] }
                checks: { type: object, additionalProperties: true }
            checks: { type: object, additionalProperties: true }
            counts: { type: object, additionalProperties: true }
            can_evaluate: { type: boolean }
            next_actions:
              type: array
              items: { type: object, additionalProperties: true }
        error: { type: "null" }
        meta: { $ref: "#/components/schemas/Meta" }

    LivenessEnvelope:
      type: object
      properties:
        data:
          type: object
          properties:
            status: { type: string, enum: [ok] }
            message: { type: string }
        error: { type: "null" }
        meta: { $ref: "#/components/schemas/Meta" }

    ReadinessEnvelope:
      type: object
      properties:
        data:
          type: object
          properties:
            status: { type: string, enum: [ready, not_ready] }
            checks: { type: object, additionalProperties: true }
        error: { type: "null" }
        meta: { $ref: "#/components/schemas/Meta" }

    ProfileEnvelope:
      type: object
      properties:
        data: { $ref: "#/components/schemas/Profile" }
        error: { type: "null" }
        meta: { $ref: "#/components/schemas/Meta" }

    ProfileListEnvelope:
      type: object
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/Profile" }
        error: { type: "null" }
        meta: { $ref: "#/components/schemas/Meta" }

    ProfilePdfPreviewEnvelope:
      type: object
      properties:
        data: { $ref: "#/components/schemas/ProfilePdfPreview" }
        error: { type: "null" }
        meta: { $ref: "#/components/schemas/Meta" }

    ProfileDeleteImpactEnvelope:
      type: object
      properties:
        data: { $ref: "#/components/schemas/ProfileDeleteImpact" }
        error: { type: "null" }
        meta: { $ref: "#/components/schemas/Meta" }

    EvaluateEnvelope:
      type: object
      properties:
        data: { $ref: "#/components/schemas/EvaluateOut" }
        error: { type: "null" }
        meta: { $ref: "#/components/schemas/Meta" }

    BulkEvaluateEnvelope:
      type: object
      properties:
        data: { $ref: "#/components/schemas/BulkEvaluateOut" }
        error: { type: "null" }
        meta: { $ref: "#/components/schemas/Meta" }

    EvaluateByListingsEnvelope:
      type: object
      properties:
        data: { $ref: "#/components/schemas/EvaluateByListingsOut" }
        error: { type: "null" }
        meta: { $ref: "#/components/schemas/Meta" }

    HistoryListEnvelope:
      type: object
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/HistoryItem" }
        error: { type: "null" }
        meta:
          allOf:
            - $ref: "#/components/schemas/Meta"
            - type: object
              properties:
                total: { type: integer }
                submittable_count: { type: integer }
                grouped:
                  type: object
                  additionalProperties:
                    type: array
                    items: { $ref: "#/components/schemas/HistoryItem" }

    HistoryDetailEnvelope:
      type: object
      properties:
        data: { $ref: "#/components/schemas/HistoryDetail" }
        error: { type: "null" }
        meta: { $ref: "#/components/schemas/Meta" }

    TailoringJobEnvelope:
      type: object
      properties:
        data: { $ref: "#/components/schemas/TailoringJob" }
        error: { type: "null" }
        meta: { $ref: "#/components/schemas/Meta" }

    SubmittableEnvelope:
      type: object
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/SubmittableItem" }
        error: { type: "null" }
        meta:
          allOf:
            - $ref: "#/components/schemas/Meta"
            - type: object
              properties:
                count: { type: integer }

    JobListingEnvelope:
      type: object
      properties:
        data: { $ref: "#/components/schemas/JobListingDetail" }
        error: { type: "null" }
        meta: { $ref: "#/components/schemas/Meta" }

    JobListingListEnvelope:
      type: object
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/JobListing" }
        error: { type: "null" }
        meta:
          allOf:
            - $ref: "#/components/schemas/Meta"
            - type: object
              properties:
                total: { type: integer }
                limit: { type: integer }
                offset: { type: integer }
                range_start: { type: integer }
                range_end: { type: integer }
                sort_by: { type: string }
                sort_dir: { type: string }
                status: { type: string, nullable: true }

    ApplicationEnvelope:
      type: object
      properties:
        data: { $ref: "#/components/schemas/Application" }
        error: { type: "null" }
        meta: { $ref: "#/components/schemas/Meta" }

    ApplicationListEnvelope:
      type: object
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/Application" }
        error: { type: "null" }
        meta:
          allOf:
            - $ref: "#/components/schemas/Meta"
            - type: object
              properties:
                total: { type: integer }
                limit: { type: integer }
                offset: { type: integer }
                range_start: { type: integer }
                range_end: { type: integer }
                sort_by: { type: string }
                sort_dir: { type: string }
                status: { type: string, nullable: true }

    IdEnvelope:
      type: object
      properties:
        data:
          type: object
          properties:
            id: { type: string, format: uuid }
        error: { type: "null" }
        meta: { $ref: "#/components/schemas/Meta" }

    ErrorEnvelope:
      type: object
      properties:
        data: { type: "null" }
        error: { $ref: "#/components/schemas/Error" }
        meta: { $ref: "#/components/schemas/Meta" }

  responses:
    Error:
      description: Error envelope
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
