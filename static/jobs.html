<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>JD Database - AI Career Intelligence System</title>
    <link rel="stylesheet" href="/styles.css" />
</head>
<body>
    <header class="site-header">
        <div class="wrap header-row">
            <div>
                <h1>JD Database</h1>
                <p class="sub">Browse job descriptions stored by scrapers.</p>
            </div>
        </div>
    </header>

    <div class="app-shell">
    <aside class="app-sidebar" aria-label="Primary">
        <div class="sidebar-group">
            <div class="sidebar-group-title">Evaluate</div>
            <a class="tab-btn" href="/#evaluate">Evaluate</a>
            <a class="tab-btn" href="/#history">History</a>
            <a class="tab-btn" href="/#submittable">Submittable</a>
        </div>
        <div class="sidebar-group">
            <div class="sidebar-group-title">Data</div>
            <a class="tab-btn active" href="/jobs.html" aria-current="page">JD Database</a>
            <a class="tab-btn" href="/#profile">Profile</a>
            <a class="tab-btn" href="/applications.html">Applications</a>
        </div>
        <div class="sidebar-group">
            <div class="sidebar-group-title">Pipeline</div>
            <a class="tab-btn" href="/scrapes.html">Scrapes</a>
        </div>
    </aside>
    <main class="app-main"><div class="wrap">
        <section class="panel">
            <form id="filters" class="filters">
                <label>
                    Search
                    <input
                        id="q"
                        name="q"
                        type="search"
                        placeholder="Title, company, location, JD text"
                    />
                </label>
                <label>
                    Source
                    <select id="source" name="source">
                        <option value="">All sources</option>
                        <option value="104">104</option>
                        <option value="yourator">Yourator</option>
                        <option value="linkedin">LinkedIn</option>
                    </select>
                </label>
                <label>
                    Status
                    <select id="status" name="status">
                        <option value="">All</option>
                        <option value="unanalyzed">Unanalyzed</option>
                        <option value="ready_to_submit">Ready to submit</option>
                        <option value="needs_tailoring">Needs tailoring</option>
                        <option value="skip">Skipped</option>
                        <option value="failed-invalid">Failed invalid</option>
                    </select>
                </label>
                <label>
                    Sort by
                    <select id="sort-by" name="sort_by">
                        <option value="scraped_at">Scraped date</option>
                        <option value="score">Score</option>
                        <option value="company">Company</option>
                        <option value="source">Source</option>
                    </select>
                </label>
                <label>
                    Direction
                    <select id="sort-dir" name="sort_dir">
                        <option value="desc">Descending</option>
                        <option value="asc">Ascending</option>
                    </select>
                </label>
                <button type="submit">Search</button>
            </form>
            <div class="batch-actions">
                <label>
                    Profile
                    <select id="profile-select">
                        <option value="">Loading profiles...</option>
                    </select>
                </label>
                <div class="selection-actions">
                    <button id="select-page" type="button">Select current page</button>
                    <button id="clear-selection" type="button">Clear selection</button>
                    <span id="selection-count" class="muted">0 selected</span>
                </div>
                <button id="score-selected" type="button">Score selected</button>
                <button id="delete-selected" class="danger" type="button">Delete selected</button>
                <button id="delete-stale" type="button">Delete stale…</button>
                <span id="batch-status" class="muted"></span>
            </div>
            <div id="batch-results" class="batch-results" hidden></div>
        </section>

        <section class="jobs-layout">
            <aside class="panel job-list-panel">
                <div class="list-header">
                    <h2>Listings</h2>
                    <div class="list-counts">
                        <span id="result-count" class="muted"></span>
                        <div class="pagination-controls" aria-label="Listings pagination">
                            <button id="prev-page" type="button">Previous</button>
                            <span id="page-range" class="muted"></span>
                            <button id="next-page" type="button">Next</button>
                        </div>
                    </div>
                </div>
                <div id="list-status" class="muted"></div>
                <ol id="job-list" class="job-list"></ol>
            </aside>

            <article class="panel job-detail-panel">
                <div id="detail-empty" class="empty-state">
                    Select a job listing to inspect its full JD.
                </div>
                <div id="detail" hidden>
                    <div class="detail-header">
                        <div>
                            <p id="detail-source" class="eyebrow"></p>
                            <h2 id="detail-title"></h2>
                            <p id="detail-company" class="muted"></p>
                        </div>
                        <a
                            id="detail-url"
                            class="button-link"
                            href="#"
                            target="_blank"
                            rel="noreferrer"
                        >
                            Open Source
                        </a>
                        <button id="track-listing" type="button">Add to tracker</button>
                    </div>
                    <div id="track-status" class="muted"></div>
                    <dl class="meta-grid">
                        <div>
                            <dt>Location</dt>
                            <dd id="detail-location"></dd>
                        </div>
                        <div>
                            <dt>Scraped</dt>
                            <dd id="detail-scraped"></dd>
                        </div>
                        <div>
                            <dt>Changed</dt>
                            <dd id="detail-changed"></dd>
                        </div>
                        <div>
                            <dt>Status</dt>
                            <dd id="detail-status"></dd>
                        </div>
                    </dl>
                    <pre id="detail-description" class="jd-text"></pre>
                </div>
            </article>
        </section>
    </div></main>
    </div>

    <script src="/shared.js" defer></script>
    <script src="/jobs.js" defer></script>
</body>
</html>
