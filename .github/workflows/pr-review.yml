name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

jobs:
  test:
    name: Unit + Integration tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps
        run: pip install -r backend/requirements.txt

      - name: Lint (ruff)
        run: python -m ruff check backend/app

      - name: Type check (mypy, soft gate)
        continue-on-error: true
        run: python -m mypy

      - name: Run tests
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test
          ANTHROPIC_API_KEY: fake-key-for-tests
        run: |
          set +e
          python -m pytest backend/tests/unit/ backend/tests/integration/v2/ \
            -q --tb=short 2>&1 | tee test-results.txt
          exit_code=${PIPESTATUS[0]}
          echo "exit_code=${exit_code}" >> "$GITHUB_ENV"
          exit "${exit_code}"

      - name: Post test results to PR
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            if (!fs.existsSync('test-results.txt')) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: `## ❌ SIT Results: failed\n\nTests did not run — a setup step failed before pytest could start.\n\n[Full logs](${runUrl})`,
              });
              return;
            }

            const results = fs.readFileSync('test-results.txt', 'utf8');
            const lines = results.split('\n');

            // Parse summary line (last line matching "X passed" or "X failed")
            const summaryLine = [...lines].reverse().find(l => /\d+ (passed|failed)/.test(l)) || '';
            const passedMatch = summaryLine.match(/(\d+) passed/);
            const failedMatch = summaryLine.match(/(\d+) failed/);
            const passedCount = passedMatch ? parseInt(passedMatch[1]) : 0;
            const failedCount = failedMatch ? parseInt(failedMatch[1]) : 0;

            // Extract FAILED lines (test name + short reason)
            const failedLines = lines.filter(l => l.startsWith('FAILED '));
            const failedTests = failedLines.map(l => {
              const body = l.replace(/^FAILED /, '');
              const dashIdx = body.indexOf(' - ');
              return dashIdx === -1
                ? { name: body.trim(), reason: '' }
                : { name: body.slice(0, dashIdx).trim(), reason: body.slice(dashIdx + 3).trim() };
            });

            const icon = failedCount > 0 ? '❌' : '✅';
            const statusText = failedCount > 0 ? 'failed' : 'passed';

            let body = `## ${icon} SIT Results: ${statusText}\n\n- Passed: ${passedCount}\n- Failed: ${failedCount}\n`;
            if (failedTests.length > 0) {
              body += `\nFailed tests:\n`;
              for (const t of failedTests) {
                body += `- \`${t.name}\``;
                if (t.reason) body += `\n  \`${t.reason}\``;
                body += '\n';
              }
            }
            body += `\n[Full logs](${runUrl})`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
