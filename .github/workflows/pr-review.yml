name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

jobs:
  test:
    name: Unit + Integration tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install WeasyPrint system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz0b libffi8

      - name: Install deps
        run: pip install -r backend/requirements.txt

      - name: Lint (ruff)
        run: python -m ruff check backend/app

      - name: Shell script syntax check
        run: bash -n scripts/e2e-check.sh && bash -n scripts/start.sh && bash -n scripts/restart-app.sh && bash -n scripts/test.sh

      - name: Type check (mypy, soft gate)
        continue-on-error: true
        run: python -m mypy

      - name: Run deterministic AI harnesses
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test
          ANTHROPIC_API_KEY: fake-key-for-tests
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set -o pipefail
          mkdir -p artifacts/evals
          python -m backend.app.cli eval-harness \
            --backend fake \
            --report-json artifacts/evals/evaluate.json \
            --report-md artifacts/evals/evaluate.md \
            2>&1 | tee eval-harness.txt
          python -m backend.app.cli tailor-harness \
            --backend fake \
            --report-json artifacts/evals/tailor.json \
            --report-md artifacts/evals/tailor.md \
            2>&1 | tee tailor-harness.txt
          python -m backend.app.cli extract-harness \
            --backend fake \
            --report-json artifacts/evals/extract.json \
            --report-md artifacts/evals/extract.md \
            2>&1 | tee extract-harness.txt
          python -m backend.app.cli beautify-harness \
            --backend fake \
            --report-json artifacts/evals/beautify.json \
            --report-md artifacts/evals/beautify.md \
            2>&1 | tee beautify-harness.txt

      - name: Run tests
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test
          ANTHROPIC_API_KEY: fake-key-for-tests
        run: |
          set +e
          python -m pytest backend/tests/unit/ backend/tests/integration/v2/ \
            -q --tb=short 2>&1 | tee test-results.txt
          exit_code=${PIPESTATUS[0]}
          echo "exit_code=${exit_code}" >> "$GITHUB_ENV"
          exit "${exit_code}"

      - name: Upload AI harness reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-harness-reports
          path: |
            artifacts/evals/*.json
            artifacts/evals/*.md
            *-harness.txt
          if-no-files-found: warn
          retention-days: 30

      - name: Post test results to PR
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            function readEvalSummary() {
              const reportDir = 'artifacts/evals';
              if (fs.existsSync(reportDir)) {
                const reports = fs.readdirSync(reportDir)
                  .filter(name => name.endsWith('.md'))
                  .sort()
                  .map(name => fs.readFileSync(`${reportDir}/${name}`, 'utf8'));
                if (reports.length > 0) {
                  return reports.join('\n\n');
                }
              }

              const logs = ['eval-harness.txt', 'tailor-harness.txt', 'extract-harness.txt', 'beautify-harness.txt']
                .filter(name => fs.existsSync(name))
                .map(name => `### ${name}\n\n\`\`\`text\n${fs.readFileSync(name, 'utf8').slice(-4000)}\n\`\`\``);
              if (logs.length > 0) {
                return `## AI Harness Logs\n\n${logs.join('\n\n')}`;
              }
              return '## AI Harness Reports\n\nAI harnesses did not produce a report.';
            }

            const evalSummary = readEvalSummary();

            if (!fs.existsSync('test-results.txt')) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: `${evalSummary}\n\n## SIT Results: failed\n\nTests did not run, or an earlier CI gate failed before pytest could start.\n\n[Full logs](${runUrl})`,
              });
              return;
            }

            const results = fs.readFileSync('test-results.txt', 'utf8');
            const lines = results.split('\n');
            const summaryLine = [...lines].reverse().find(l => /\d+ (passed|failed)/.test(l)) || '';
            const passedMatch = summaryLine.match(/(\d+) passed/);
            const failedMatch = summaryLine.match(/(\d+) failed/);
            const passedCount = passedMatch ? parseInt(passedMatch[1]) : 0;
            const failedCount = failedMatch ? parseInt(failedMatch[1]) : 0;

            const failedLines = lines.filter(l => l.startsWith('FAILED '));
            const failedTests = failedLines.map(l => {
              const body = l.replace(/^FAILED /, '');
              const dashIdx = body.indexOf(' - ');
              return dashIdx === -1
                ? { name: body.trim(), reason: '' }
                : { name: body.slice(0, dashIdx).trim(), reason: body.slice(dashIdx + 3).trim() };
            });

            const statusText = failedCount > 0 ? 'failed' : 'passed';
            let body = `${evalSummary}\n\n## SIT Results: ${statusText}\n\n- Passed: ${passedCount}\n- Failed: ${failedCount}\n`;
            if (failedTests.length > 0) {
              body += `\nFailed tests:\n`;
              for (const t of failedTests) {
                body += `- \`${t.name}\``;
                if (t.reason) body += `\n  \`${t.reason}\``;
                body += '\n';
              }
            }
            body += `\n[Full logs](${runUrl})`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
