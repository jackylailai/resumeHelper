name: PR Review Request

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  notify:
    name: Notify Discord for review
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Send review request to Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          REPO: ${{ github.repository }}
          ACTION: ${{ github.event.action }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "DISCORD_WEBHOOK_URL not set, skipping notification"
            exit 0
          fi

          curl -s -X POST "$DISCORD_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "{
              \"content\": \"🔍 **PR Review Request** [$ACTION]\n**Repo:** $REPO\n**PR #$PR_NUMBER:** $PR_TITLE\n**URL:** $PR_URL\n\n\`[claude-review pr=$PR_NUMBER repo=$REPO]\`\"
            }"
