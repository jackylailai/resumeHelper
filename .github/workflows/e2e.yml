name: E2E (Playwright)

# Drives the deployed UI via pytest-playwright. Runs the full flow suite
# (5 tests) on every PR that touches backend / frontend / e2e code, and
# publishes screenshots as a downloadable artifact.
#
# Non-blocking by design — graduate to "required" after the suite has
# proved stable across ~2 weeks of PRs.

on:
  pull_request:
    paths:
      - "backend/**"
      - "static/**"
      - "tools/e2e/**"
      - ".github/workflows/e2e.yml"
  workflow_dispatch: {}

jobs:
  e2e:
    name: Flow tests + screenshot artifacts
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/test
      LLM_BACKEND: fake
      E2E_BASE_URL: http://localhost:8001

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install backend deps
        run: pip install -r backend/requirements.txt

      - name: Install Playwright + Chromium
        run: |
          pip install playwright pytest-playwright
          python -m playwright install --with-deps chromium

      - name: Apply database migrations
        run: python -m alembic -c backend/alembic.ini upgrade head

      - name: Run E2E suite
        run: python -m pytest tools/e2e/tests/ -v --tb=short

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: tools/e2e/screenshots/
          if-no-files-found: warn
          retention-days: 30

      - name: Upload uvicorn log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: uvicorn-log
          path: tools/e2e/uvicorn.log
          if-no-files-found: ignore
