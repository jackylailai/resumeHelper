services:
  postgres:
    image: postgres:16-alpine
    container_name: resumehelper-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: resume_helper
    ports:
      - "5432:5432"
    volumes:
      - ${RESUMEHELPER_DATA_PATH:-~/resumeHelper_data}:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d resume_helper"]
      interval: 5s
      timeout: 3s
      retries: 10
