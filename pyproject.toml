[tool.ruff]
line-length = 100
# target-version pinned to py39: SQLAlchemy 2.x evaluates `Mapped[...]` annotations
# at runtime, so PEP 604 (`X | None`) and `datetime.UTC` would crash anyone still
# on 3.9/3.10. Bump this once the project drops 3.9 support.
target-version = "py39"
extend-exclude = ["backend/alembic/versions"]

[tool.ruff.lint]
select = [
    "E", "F", "W",   # pycodestyle / pyflakes
    "I",             # isort
    "B",             # bugbear
    "SIM",           # simplify
    "RUF",           # ruff-specific
]
ignore = [
    "B008",  # FastAPI relies on `Depends(...)` / `File(...)` in defaults.
]

[tool.ruff.lint.isort]
known-first-party = ["backend"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_return_any = true
files = ["backend/app"]
exclude = ["backend/alembic/versions"]

[[tool.mypy.overrides]]
module = ["pypdf.*", "docx.*", "testcontainers.*", "schemathesis.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]
markers = [
    "integration: tests that require Postgres via testcontainers",
    "contract: schemathesis-driven OpenAPI conformance tests",
]

[tool.coverage.run]
source = ["backend/app"]
omit = ["backend/alembic/*", "backend/app/main.py"]
branch = true

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
