[project]
name = "resume-helper"
version = "0.1.0"
requires-python = ">=3.11"

[project.optional-dependencies]
e2e = [
    "playwright>=1.59",
    "pytest-playwright>=0.7",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["backend/alembic/versions"]

[tool.ruff.lint]
select = [
    "E", "F", "W",   # pycodestyle / pyflakes
    "I",             # isort
    "B",             # bugbear
    "SIM",           # simplify
    "RUF",           # ruff-specific
    "UP",            # pyupgrade — safe now that py311 is the floor
]
ignore = [
    "B008",  # FastAPI relies on `Depends(...)` / `File(...)` in defaults.
]

[tool.ruff.lint.isort]
known-first-party = ["backend"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_return_any = true
files = ["backend/app"]
exclude = ["backend/alembic/versions"]

[[tool.mypy.overrides]]
module = ["pypdf.*", "docx.*", "testcontainers.*", "schemathesis.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]
markers = [
    "integration: tests that require Postgres via testcontainers",
    "contract: schemathesis-driven OpenAPI conformance tests",
]

[tool.coverage.run]
source = ["backend/app"]
omit = ["backend/alembic/*", "backend/app/main.py"]
branch = true

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
